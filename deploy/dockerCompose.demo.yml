services:
  master:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: silifs:latest
    container_name: silifs-master
    command: python -m master.server
    ports:
      - "50051:50051"
    networks:
      - silifs-net

  datanode1:
    image: silifs:latest
    container_name: silifs-datanode1
    command: >
      python -m datanode.server --node-id node1 --port 50052 --capacity-mb 2048
      --master master:50051 --advertise datanode1:50052
    volumes:
      - cluster-data:/app/data
    depends_on:
      - master
    networks:
      - silifs-net

  datanode2:
    image: silifs:latest
    container_name: silifs-datanode2
    command: >
      python -m datanode.server --node-id node2 --port 50052 --capacity-mb 2048
      --master master:50051 --advertise datanode2:50052
    volumes:
      - cluster-data:/app/data
    depends_on:
      - master
    networks:
      - silifs-net

  datanode3:
    image: silifs:latest
    container_name: silifs-datanode3
    command: >
      python -m datanode.server --node-id node3 --port 50052 --capacity-mb 2048
      --master master:50051 --advertise datanode3:50052
    volumes:
      - cluster-data:/app/data
    depends_on:
      - master
    networks:
      - silifs-net

  monitoring:
    image: silifs:latest
    container_name: silifs-monitoring
    command: >
      python monitoring/app.py --host 0.0.0.0 --port 8080
      --master master:50051
      --data-dir /app/data
      --metrics-csv /app/experiments/results/client_metrics.csv
      --capacity-mb 2048
      --nodes node1=datanode1:50052,node2=datanode2:50052,node3=datanode3:50052
    ports:
      - "8080:8080"
    volumes:
      - cluster-data:/app/data:ro
      - ../experiments/results:/app/experiments/results
    depends_on:
      - master
      - datanode1
      - datanode2
      - datanode3
    networks:
      - silifs-net

  client:
    image: silifs:latest
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["python", "-m", "client.cli", "--master", "master:50051"]
    volumes:
      - ../:/work
      - ../experiments/results:/app/experiments/results
    networks:
      - silifs-net

volumes:
  cluster-data:

networks:
  silifs-net:
    driver: bridge
