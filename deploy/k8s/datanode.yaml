apiVersion: v1
kind: Service
metadata:
  name: datanode
  labels:
    app: silifs-datanode
spec:
  clusterIP: None
  selector:
    app: silifs-datanode
  ports:
    - port: 50052
      targetPort: 50052
      name: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: datanode
  labels:
    app: silifs-datanode
spec:
  serviceName: datanode
  replicas: 3
  selector:
    matchLabels:
      app: silifs-datanode
  template:
    metadata:
      labels:
        app: silifs-datanode
    spec:
      containers:
        - name: datanode
          image: silifs:latest
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["python", "-m", "datanode.server"]
          args:
            - "--node-id"
            - "$(POD_NAME)"
            - "--port"
            - "50052"
            - "--capacity-mb"
            - "2048"
            - "--master"
            - "master:50051"
            - "--advertise"
            - "$(POD_NAME).datanode:50052"
          ports:
            - containerPort: 50052
              name: grpc
          volumeMounts:
            - name: chunk-data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: chunk-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
